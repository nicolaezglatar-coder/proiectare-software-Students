plugins {
    id 'java'
    id 'application'
}

group = 'ro.ulbs.proiectaresoftware'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ro.ulbs.proiectaresoftware.students.Application'
}

test {
    useJUnitPlatform()
}
